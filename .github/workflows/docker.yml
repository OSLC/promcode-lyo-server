name: "Docker Build and Push (PROMCODE Server)"

on:
  push:
    branches: [main]
    paths:
      - 'promcode-lyo-server/**'
      - 'promcode-lyo-server-model/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
  release:
    types: [published]
  schedule:
    # Weekly rebuild every Thursday at 5:00 AM UTC to get latest base image updates
    - cron: '0 5 * * 4'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Publish server image
    if: github.repository == 'OSLC/promcode-lyo-server' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # Push the built server image to GHCR.
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For pushes to main branch or scheduled builds, tag as "latest"
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'schedule' }}
            # For releases, create semantic version tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=PROMCODE Server
            org.opencontainers.image.description=A demonstration server for OSLC toolchain management of PROject Management of COntracted DElivery

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=promcode-server
          cache-to: type=gha,mode=max,scope=promcode-server
          # For scheduled builds, don't use cache to ensure fresh base images
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: true

      - name: Output image details
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Updated image tags:\n'
          printf '### Updated image tags\n\n' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            printf '  - %s\n' "$tag"
            printf -- '- `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"
          printf 'Digest: %s\n' "$IMAGE_DIGEST"
          printf '\nDigest: `%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
