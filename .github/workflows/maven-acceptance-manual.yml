name: Acceptance test (Lyo HEAD)
run-name: "acceptance@${{ github.ref_name }} (Lyo@${{ github.event.inputs.lyoBranch }}; link: ${{ inputs.link }})"


on:
  workflow_dispatch:
    inputs:
      lyoBranch:
        description: 'Lyo branch to test on'
        required: true
        default: 'main'
      lyoRepo:
        description: 'Lyo repository or fork'
        required: true
        default: 'eclipse-lyo/lyo'
      link:
        description: 'PR/issue link (e.g., to Lyo)'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.lyoRepo }}-${{ github.event.inputs.lyoBranch }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

jobs:
  build-jdk17:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
#         java-version: [17]
# #        distribution: ['temurin', 'zulu', 'oracle', 'corretto', 'microsoft', 'liberica']
#         distribution: ['temurin']
        include:
          - java-version: '21'
            distribution: 'temurin'
          - java-version: '25'
            distribution: 'liberica'
          - java-version: '27'
            distribution: 'liberica'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ github.event.inputs.lyoRepo }}"
          ref: "${{ github.event.inputs.lyoBranch }}"
          path: lyo-trunk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution:  ${{ matrix.distribution }}
          java-version: ${{ matrix.java-version }}
      - name: 'Maven build (Lyo)'
        run: mvn -B --no-transfer-progress clean install --file lyo-trunk/pom.xml -P '!spotbugs,!spotless,!enforcer' -Dmaven.test.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dcyclonedx.skip=true
      - name: Detect checked-out Lyo version
        id: lyo-version
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          mvn -B --no-transfer-progress --non-recursive --file lyo-trunk/pom.xml \
            org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate \
            -Dexpression=project.version -Doutput="$RUNNER_TEMP/lyo-version.txt"
          lyo_version="$(cat "$RUNNER_TEMP/lyo-version.txt")"
          if [[ ! "$lyo_version" =~ ^[0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid Lyo version: $lyo_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$lyo_version" >> "$GITHUB_OUTPUT"
      - name: 'Maven build (project)'
        env:
          LYO_VERSION: ${{ steps.lyo-version.outputs.version }}
        run: |
          mvn -B clean verify --file main/promcode-lyo-server/pom.xml "-Dversion.lyo=$LYO_VERSION"
