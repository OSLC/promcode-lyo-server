services:
  fuseki:
    image: docker.io/secoresearch/fuseki:latest
    ports:
      - "127.0.0.1:${FUSEKI_PORT:-3030}:3030"
    environment:
      - ADMIN_PASSWORD=admin
      - ENABLE_UPDATE=true
    volumes:
      - fuseki-data:/fuseki-base/databases
    networks:
      - promcode-network

  promcode-server:
    image: ghcr.io/oslc/promcode-lyo-server:latest
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - fuseki
    environment:
      - LYO_STORE_SPARQL_QUERY_ENDPOINT=http://fuseki:3030/ds/sparql
      - LYO_STORE_SPARQL_UPDATE_ENDPOINT=http://fuseki:3030/ds/update
    networks:
      - promcode-network

volumes:
  fuseki-data:

networks:
  promcode-network:
    driver: bridge
